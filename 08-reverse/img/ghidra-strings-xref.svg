<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .win  { fill:#ffffff; stroke:#9aa5b1; stroke-width:1; }
    .hdr  { fill:#3b5ba5; }
    .hdrtx{ fill:#ffffff; font-size:12px; font-weight:bold; }
    .code { fill:#1b1f24; font-size:12px; font-family:"DejaVu Sans Mono", monospace; }
    .addr { fill:#6b4fbb; font-size:12px; font-family:"DejaVu Sans Mono", monospace; }
    .str  { fill:#1a7f37; font-size:12px; font-family:"DejaVu Sans Mono", monospace; }
    .cap  { fill:#222; font-size:12.5px; }
    .capb { fill:#222; font-size:12.5px; font-weight:bold; }
    .card { fill:#fbfbfd; stroke:#c7cdd6; }
    .ar   { stroke:#b02a37; stroke-width:2.5; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b02a37"/>
    </marker>
  </defs>

  <!-- left: Defined Strings -->
  <rect class="hdr" x="16" y="14" width="430" height="22"/>
  <text class="hdrtx" x="24" y="29">Defined Strings  (меню Window -&gt; Defined Strings)</text>
  <rect class="win" x="16" y="36" width="430" height="210"/>
  <rect x="16" y="36" width="430" height="20" fill="#e9ecef"/>
  <text class="capb" x="26" y="51">Address</text>
  <text class="capb" x="150" y="51">String</text>
  <rect x="17" y="60" width="428" height="22" fill="#fff3bf"/>
  <text class="addr" x="26" y="76">00102008</text>
  <text class="str"  x="150" y="76">"Enter password: "</text>
  <text class="addr" x="26" y="100">0010201a</text>
  <text class="str"  x="150" y="100">"Correct! flag{...}"</text>
  <text class="addr" x="26" y="124">0010202f</text>
  <text class="str"  x="150" y="124">"Wrong"</text>
  <text class="addr" x="26" y="148">00102036</text>
  <text class="str"  x="150" y="148">"%63s"</text>
  <text class="cap"  x="26" y="186">Правый клик по строке -&gt;</text>
  <text class="cap"  x="26" y="204">References -&gt; Show References</text>

  <!-- arrow to XREF popup -->
  <path class="ar" d="M448 71 C 470 71, 470 92, 486 92"/>

  <!-- XREF popup -->
  <rect class="card" x="488" y="56" width="396" height="92" rx="5"/>
  <text class="capb" x="500" y="74">References to 00102008</text>
  <rect x="496" y="82" width="380" height="20" fill="#fff3bf"/>
  <text class="code" x="504" y="97">main  00101abc   CALL</text>
  <text class="cap"  x="500" y="122">Двойной клик по строке XREF -&gt; прыжок</text>
  <text class="cap"  x="500" y="140">прямо в функцию проверки (без поиска main).</text>

  <!-- tip card: R key -->
  <rect class="card" x="16" y="268" width="430" height="110" rx="5"/>
  <text class="capb" x="28" y="290">Клавиша R - показать символ</text>
  <text class="cap"  x="28" y="312">В псевдокоде число вместо буквы:</text>
  <text class="code" x="28" y="332">if (input[0] == 0x66)</text>
  <text class="cap"  x="28" y="356">Правый клик по 0x66 -&gt; Convert -&gt; Char</text>
  <text class="cap"  x="28" y="374">(или клавиша R) -&gt; станет <tspan font-family="DejaVu Sans Mono" font-size="11.5">'f'</tspan>.</text>

  <!-- tip card: DAT_ -->
  <rect class="card" x="462" y="268" width="422" height="110" rx="5"/>
  <text class="capb" x="474" y="290">Массив-эталон = DAT_...</text>
  <text class="cap"  x="474" y="312">В коде он выглядит как</text>
  <text class="code" x="474" y="332">DAT_00102010</text>
  <text class="cap"  x="474" y="356">Двойной клик -&gt; в Listing видно байты</text>
  <text class="code" x="474" y="374">59 4f 49 58 ...  (Copy Special -&gt; Python List)</text>
</svg>
