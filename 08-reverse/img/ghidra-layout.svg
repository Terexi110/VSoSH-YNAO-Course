<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .win   { fill:#ffffff; stroke:#9aa5b1; stroke-width:1; }
    .hdr   { fill:#3b5ba5; }
    .hdrtx { fill:#ffffff; font-size:12px; font-weight:bold; }
    .mtx   { fill:#333; font-size:11px; }
    .tree  { fill:#1b1f24; font-size:12px; }
    .code  { fill:#1b1f24; font-size:11.5px; font-family:"DejaVu Sans Mono", monospace; }
    .kw    { fill:#0b5cad; }
    .str   { fill:#1a7f37; }
    .num   { fill:#b02a37; font-size:12px; font-weight:bold; }
    .cap   { fill:#222; font-size:12.5px; }
    .capb  { fill:#222; font-size:12.5px; font-weight:bold; }
  </style>
  <defs>
    <g id="c1"><circle r="9" fill="#b02a37"/><text x="0" y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="c2"><circle r="9" fill="#b02a37"/><text x="0" y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="c3"><circle r="9" fill="#b02a37"/><text x="0" y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>

  <!-- window -->
  <rect class="win" x="8" y="8" width="884" height="372"/>
  <rect class="hdr" x="8" y="8" width="884" height="24" fill="#2b3a55"/>
  <text class="hdrtx" x="20" y="25">Ghidra - CodeBrowser</text>
  <rect x="8" y="32" width="884" height="22" fill="#e9ecef" stroke="#cfd4da"/>
  <text class="mtx" x="20" y="47">File   Edit   Analysis   Navigation   Search   </text>
  <rect x="300" y="35" width="66" height="17" fill="#fff3bf" stroke="#b02a37"/>
  <text class="mtx" x="306" y="47" font-weight="bold">Window</text>
  <text class="mtx" x="376" y="47">Help      (Window -&gt; Defined Strings)</text>

  <!-- left: Symbol Tree -->
  <rect class="hdr" x="16" y="60" width="206" height="22"/>
  <text class="hdrtx" x="24" y="75">Symbol Tree</text>
  <rect class="win" x="16" y="82" width="206" height="286"/>
  <text class="tree" x="26" y="104" font-weight="bold">Functions</text>
  <text class="tree" x="42" y="126">f  entry</text>
  <rect x="22" y="134" width="194" height="18" fill="#fff3bf"/>
  <text class="tree" x="42" y="148" font-weight="bold">f  main</text>
  <use href="#c1" x="206" y="143"/>
  <text class="tree" x="42" y="170">f  FUN_00101230</text>
  <text class="tree" x="42" y="192">f  FUN_001012a0</text>
  <text class="tree" x="26" y="228" font-weight="bold">Labels</text>
  <text class="tree" x="42" y="250">DAT_00102010</text>

  <!-- center: Listing -->
  <rect class="hdr" x="230" y="60" width="258" height="22"/>
  <text class="hdrtx" x="238" y="75">Listing (ассемблер)</text>
  <rect class="win" x="230" y="82" width="258" height="286"/>
  <text class="code" x="240" y="104">main:</text>
  <text class="code" x="252" y="124">PUSH   RBP</text>
  <text class="code" x="252" y="144">MOV    RBP, RSP</text>
  <text class="code" x="252" y="164">CALL   gets</text>
  <text class="code" x="252" y="184">CALL   strcmp</text>
  <text class="code" x="252" y="204">TEST   EAX, EAX</text>
  <text class="code" x="252" y="224">JNZ    wrong</text>
  <text class="code" x="252" y="244">CALL   puts  ; Correct</text>

  <!-- right: Decompile -->
  <rect class="hdr" x="496" y="60" width="388" height="22"/>
  <text class="hdrtx" x="504" y="75">Decompile - псевдокод C</text>
  <rect class="win" x="496" y="82" width="388" height="286"/>
  <text class="code" x="506" y="104"><tspan class="kw">undefined8</tspan> main(<tspan class="kw">void</tspan>)</text>
  <text class="code" x="506" y="124">{</text>
  <text class="code" x="506" y="144">  gets(buf);</text>
  <text class="code" x="506" y="164">  iVar1 = strcmp(buf, <tspan class="str">"s3cr3t"</tspan>);</text>
  <use href="#c2" x="872" y="159"/>
  <text class="code" x="506" y="184">  <tspan class="kw">if</tspan> (iVar1 == 0) {</text>
  <use href="#c3" x="872" y="179"/>
  <text class="code" x="506" y="204">    puts(<tspan class="str">"Correct! flag{...}"</tspan>);</text>
  <text class="code" x="506" y="224">  }</text>
  <text class="code" x="506" y="244">  <tspan class="kw">else</tspan> puts(<tspan class="str">"Wrong"</tspan>);</text>
  <text class="code" x="506" y="264">  <tspan class="kw">return</tspan> 0;</text>
  <text class="code" x="506" y="284">}</text>

  <!-- legend -->
  <line x1="8" y1="392" x2="892" y2="392" stroke="#cfd4da"/>
  <use href="#c1" x="22" y="412"/>
  <text class="cap" x="38" y="416">Найди <tspan font-family="DejaVu Sans Mono" font-size="11.5">main</tspan> (или <tspan font-family="DejaVu Sans Mono" font-size="11.5">entry</tspan>, если бинарь stripped), двойной клик - откроется Decompile.</text>
  <use href="#c2" x="22" y="434"/>
  <text class="cap" x="38" y="438">Пароль нередко лежит прямо в коде, в кавычках - бери и вводи.</text>
  <use href="#c3" x="22" y="456"/>
  <text class="cap" x="38" y="460">Условие победы: <tspan font-family="DejaVu Sans Mono" font-size="11.5">if (... == 0)</tspan>. Если вместо strcmp - цикл по символам со сравнением, это шифр (разбор в 8.5).</text>
</svg>
