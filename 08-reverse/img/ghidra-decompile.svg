<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .win  { fill:#ffffff; stroke:#9aa5b1; stroke-width:1; }
    .hdr  { fill:#3b5ba5; }
    .hdrtx{ fill:#ffffff; font-size:12px; font-weight:bold; }
    .code { fill:#1b1f24; font-size:12px; font-family:"DejaVu Sans Mono", monospace; }
    .kw   { fill:#0b5cad; }
    .str  { fill:#1a7f37; }
    .hex  { fill:#8a4b00; }
    .cap  { fill:#222; font-size:12.5px; }
    .card { fill:#fdf3f4; stroke:#e0b4b9; }
    .box  { fill:#eef6ee; stroke:#9ccc9c; }
  </style>
  <defs>
    <g id="n1"><circle r="9" fill="#b02a37"/><text y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">1</text></g>
    <g id="n2"><circle r="9" fill="#b02a37"/><text y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">2</text></g>
    <g id="n3"><circle r="9" fill="#b02a37"/><text y="4" text-anchor="middle" fill="#fff" font-size="12" font-weight="bold">3</text></g>
  </defs>

  <rect class="hdr" x="16" y="12" width="600" height="22"/>
  <text class="hdrtx" x="24" y="27">Decompile - проверка пароля</text>
  <rect class="win" x="16" y="34" width="600" height="312"/>

  <text class="code" x="28" y="56"><tspan class="kw">undefined8</tspan> main(<tspan class="kw">void</tspan>)</text>
  <text class="code" x="28" y="76">{</text>
  <text class="code" x="28" y="96">  <tspan class="kw">char</tspan> target[8] =</text>
  <text class="code" x="28" y="116">    {<tspan class="hex">0x59,0x4f,0x49,0x58,0x4f,0x5e,0x13,0x13</tspan>};</text>
  <use href="#n1" x="598" y="111"/>
  <text class="code" x="28" y="136">  gets(input);</text>
  <text class="code" x="28" y="156">  <tspan class="kw">for</tspan> (i = 0; i &lt; 8; i++) {</text>
  <text class="code" x="28" y="176">    <tspan class="kw">if</tspan> ( (input[i] ^ <tspan class="hex">0x2A</tspan>)</text>
  <use href="#n2" x="598" y="171"/>
  <text class="code" x="28" y="196">         != target[i] )</text>
  <use href="#n3" x="598" y="191"/>
  <text class="code" x="28" y="216">      <tspan class="kw">return</tspan> WRONG;</text>
  <text class="code" x="28" y="236">  }</text>
  <text class="code" x="28" y="256">  puts(<tspan class="str">"Correct! flag{...}"</tspan>);</text>
  <text class="code" x="28" y="276">  <tspan class="kw">return</tspan> 0;</text>
  <text class="code" x="28" y="296">}</text>

  <!-- legend cards -->
  <use href="#n1" x="646" y="48"/>
  <rect class="card" x="662" y="40" width="222" height="40" rx="4"/>
  <text class="cap" x="672" y="58"><tspan font-family="DejaVu Sans Mono" font-size="11.5">target[]</tspan> - эталон: это и есть</text>
  <text class="cap" x="672" y="74">зашифрованный верный ответ.</text>

  <use href="#n2" x="646" y="108"/>
  <rect class="card" x="662" y="100" width="222" height="40" rx="4"/>
  <text class="cap" x="672" y="118"><tspan font-family="DejaVu Sans Mono" font-size="11.5">input[i] ^ 0x2A</tspan> - что</text>
  <text class="cap" x="672" y="134">программа делает с символом.</text>

  <use href="#n3" x="646" y="168"/>
  <rect class="card" x="662" y="160" width="222" height="56" rx="4"/>
  <text class="cap" x="672" y="178">Проверка: результат должен</text>
  <text class="cap" x="672" y="194">совпасть с эталоном. Непечатные</text>
  <text class="cap" x="672" y="210">байты в коде - норма (это шифр).</text>

  <!-- bottom box: обращение -->
  <rect class="box" x="16" y="358" width="868" height="60" rx="5"/>
  <text class="cap" x="28" y="380"><tspan font-weight="bold">Обращаем:</tspan> раз <tspan font-family="DejaVu Sans Mono" font-size="11.5">(пароль[i] ^ 0x2A) == target[i]</tspan>, значит <tspan font-family="DejaVu Sans Mono" font-size="11.5">пароль[i] = target[i] ^ 0x2A</tspan>.</text>
  <text class="code" x="28" y="404">bytes(x ^ 0x2A <tspan class="kw">for</tspan> x <tspan class="kw">in</tspan> target)   -&gt;   <tspan class="str">b'secret99'</tspan></text>
</svg>
