<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="860" height="300" fill="#ffffff"/>

  <!-- Браузер -->
  <rect x="20" y="80" width="190" height="110" rx="10" fill="#e8f1fb" stroke="#3a6ea5" stroke-width="2"/>
  <text x="115" y="125" text-anchor="middle" font-size="20" font-weight="bold" fill="#1d3b5c">Браузер</text>
  <text x="115" y="152" text-anchor="middle" font-size="13" fill="#333">прокси: 127.0.0.1:8080</text>

  <!-- Burp -->
  <rect x="320" y="40" width="220" height="190" rx="10" fill="#fff1e6" stroke="#e8710a" stroke-width="2"/>
  <text x="430" y="75" text-anchor="middle" font-size="20" font-weight="bold" fill="#8a3d00">Burp Suite</text>
  <text x="430" y="97" text-anchor="middle" font-size="13" fill="#333">слушает 127.0.0.1:8080</text>
  <text x="340" y="130" font-size="13" fill="#333">Intercept: стоп и правка</text>
  <text x="340" y="155" font-size="13" fill="#333">HTTP history: всё записано</text>
  <text x="340" y="180" font-size="13" fill="#333">Repeater: повторить</text>
  <text x="340" y="205" font-size="13" fill="#333">Decoder: base64, URL</text>

  <!-- Сервер -->
  <rect x="650" y="80" width="190" height="110" rx="10" fill="#eaf6ea" stroke="#3a8a3a" stroke-width="2"/>
  <text x="745" y="125" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f5a1f">Сервер</text>
  <text x="745" y="152" text-anchor="middle" font-size="13" fill="#333">сайт задачи</text>

  <!-- стрелки запроса -->
  <line x1="210" y1="112" x2="318" y2="112" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="540" y1="112" x2="648" y2="112" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="264" y="104" text-anchor="middle" font-size="13" fill="#333">запрос</text>
  <text x="594" y="104" text-anchor="middle" font-size="13" fill="#333">запрос</text>

  <!-- стрелки ответа -->
  <line x1="648" y1="162" x2="542" y2="162" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <line x1="318" y1="162" x2="212" y2="162" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="594" y="182" text-anchor="middle" font-size="13" fill="#333">ответ</text>
  <text x="264" y="182" text-anchor="middle" font-size="13" fill="#333">ответ</text>

  <text x="430" y="275" text-anchor="middle" font-size="14" fill="#555">Burp стоит посередине: видит и может поменять каждый запрос и каждый ответ</text>
</svg>
